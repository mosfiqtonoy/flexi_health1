{% extends 'base.html' %}
{% block title %}Register — Flexi Health{% endblock %}

{% block content %}

<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="margin-top:-60px; padding-top:60px;">

    <div style="width:100%; max-width:520px; padding: 2rem 1rem;">

        <!-- HEADER -->
        <div class="text-center mb-4">
            <h1 style="font-weight:800;color:var(--text);">Create Account</h1>
            <p style="color:var(--muted);">Join Flexi Health</p>
        </div>

        <div class="card-flexi">

            <form method="POST" action="{{ url_for('auth.register') }}">

                <!-- NAME -->
                <div class="mb-3">
                    <label class="form-label-flexi">Full Name</label>
                    <input type="text" name="name"
                           class="form-control form-control-flexi"
                           required>
                </div>

                <!-- EMAIL / PHONE -->
                <div class="mb-3">
                    <label class="form-label-flexi">Email / Phone</label>
                    <input type="text" name="identifier"
                           class="form-control form-control-flexi"
                           required>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                    <label class="form-label-flexi">Password</label>
                    <input type="password" name="password"
                           class="form-control form-control-flexi"
                           required>
                </div>

                <!-- BLOOD GROUP -->
                <div class="mb-3">
                    <label class="form-label-flexi">Blood Group</label>
                    <select name="blood_group" class="form-control form-control-flexi">
                        <option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option>
                        <option>O+</option><option>O-</option>
                        <option>AB+</option><option>AB-</option>
                    </select>
                </div>

                <!-- DOB -->
                <div class="mb-3">
                    <label class="form-label-flexi">Date of Birth</label>
                    <input type="date" name="dob"
                           class="form-control form-control-flexi">
                </div>

                <!-- ADDRESS -->
                <div class="mb-3">
                    <label class="form-label-flexi">Address</label>
                    <textarea name="address"
                              class="form-control form-control-flexi"
                              rows="2"></textarea>
                </div>

                <!-- LOCATION (MAP PLACEHOLDER) -->
                <div class="mb-3">
                    <label class="form-label-flexi">Location</label>
                    <div id="map"
                         style="height:180px;border-radius:12px;
                         background:#eee;display:flex;
                         align-items:center;justify-content:center;">
                        📍 Map will load here (Google Maps / Leaflet)
                    </div>
                </div>

                <button type="submit" class="btn-flexi w-100">
                    Create Account
                </button>

            </form>

        </div>
    </div>
</div>

{% endblock %}
