{% extends "base.html" %}

{% block content %}
<div class="min-h-[90vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-lg w-full space-y-8 bg-gray-900/50 border border-gray-800 p-8 rounded-3xl backdrop-blur-xl shadow-2xl relative overflow-hidden">
        
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-green-500/10 rounded-full blur-3xl text-green-500"></div>
        
        <div class="relative z-10">
            <h2 class="text-3xl font-black text-white tracking-tight">Create Profile</h2>
            <p class="mt-2 text-sm text-gray-400 font-medium">Join Flexi Health to secure your medical future</p>
        </div>

        <form class="mt-8 space-y-5" action="{{ url_for('auth.register') }}" method="POST">
            <div class="grid grid-cols-1 gap-5">
                
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Legal Name</label>
                    <input name="name" type="text" required 
                           class="block w-full px-4 py-4 bg-gray-950 border border-gray-800 rounded-2xl text-white placeholder-gray-600 focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all outline-none" 
                           placeholder="Ex: Mosfiqur Rahman">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Email Address</label>
                        <input name="email" type="email" required 
                               class="block w-full px-4 py-4 bg-gray-950 border border-gray-800 rounded-2xl text-white placeholder-gray-600 focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all outline-none" 
                               placeholder="name@mail.com">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">SIM Phone No</label>
                        <input name="phone" type="tel" required 
                               class="block w-full px-4 py-4 bg-gray-950 border border-gray-800 rounded-2xl text-white placeholder-gray-600 focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all outline-none" 
                               placeholder="01XXXXXXXXX">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest ml-1">Access Key (Min 8 Chars)</label>
                    <input name="password" type="password" required 
                           class="block w-full px-4 py-4 bg-gray-950 border border-gray-800 rounded-2xl text-white placeholder-gray-600 focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all outline-none" 
                           placeholder="••••••••">
                </div>
            </div>

            <div class="bg-green-500/5 border border-green-500/10 p-4 rounded-2xl">
                <p class="text-[10px] text-green-400/80 leading-relaxed uppercase tracking-tighter font-medium text-center">
                    By registering, you authorize Flexi Health to track your mobile recharges and automate the 10% savings protocol.
                </p>
            </div>

            <button type="submit" 
                    class="w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold rounded-2xl text-black bg-green-500 hover:bg-green-400 focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-all shadow-lg shadow-green-500/20">
                Initialize Security Profile
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">
                Already have a profile? 
                <a href="{{ url_for('auth.login') }}" class="font-bold text-white hover:text-green-400 transition-colors ml-1">Log In Instead</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
