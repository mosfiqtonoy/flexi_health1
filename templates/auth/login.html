{% extends 'base.html' %}
{% block title %}Login — Flexi Health{% endblock %}

{% block content %}

<div class="min-vh-100 d-flex align-items-center justify-content-center"
     style="margin-top:-60px; padding-top:60px;">

    <div style="width:100%; max-width:440px; padding: 2rem 1rem;">

        <!-- HEADER -->
        <div class="text-center mb-4">
            <div style="
                width:60px;
                height:60px;
                background: linear-gradient(135deg,#22c55e,#38bdf8);
                border-radius:16px;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:1.7rem;
                margin:0 auto 1rem;
                box-shadow: 0 0 25px rgba(74,222,128,0.25);
            ">
                💚
            </div>

            <h1 style="font-size:1.8rem;font-weight:800;color:var(--text);font-family:'Syne';">
                Welcome back
            </h1>

            <p style="color:var(--muted);font-size:0.9rem;">
                Sign in to your Flexi Health account
            </p>
        </div>

        <!-- CARD -->
        <div class="card-flexi card-flexi-hover">

            <form method="POST" action="{{ url_for('auth.login') }}">

                <!-- EMAIL / PHONE -->
                <div class="mb-3">
                    <label class="form-label-flexi">Email or Phone</label>
                    <input type="text"
                           name="identifier"
                           class="form-control form-control-flexi"
                           placeholder="Enter email or phone"
                           required>
                </div>

                <!-- PASSWORD -->
                <div class="mb-4">
                    <label class="form-label-flexi">Password</label>

                    <div style="position:relative;">
                        <input type="password"
                               name="password"
                               id="passwordInput"
                               class="form-control form-control-flexi"
                               placeholder="Enter password"
                               required>

                        <button type="button"
                                onclick="togglePassword()"
                                style="
                                    position:absolute;
                                    right:12px;
                                    top:50%;
                                    transform:translateY(-50%);
                                    background:none;
                                    border:none;
                                    color:var(--muted);
                                    cursor:pointer;
                                ">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="btn-flexi w-100">
                    Sign In
                </button>

            </form>

            <!-- LINKS -->
            <div class="text-center mt-3" style="font-size:0.85rem;color:var(--muted);">

                <a href="{{ url_for('auth.forgot_password') }}"
                   style="color:var(--secondary);text-decoration:none;">
                    Forgot password?
                </a>

                <span style="margin:0 6px;">·</span>

                <a href="{{ url_for('auth.register') }}"
                   style="color:var(--primary);text-decoration:none;">
                    Create account
                </a>

            </div>

        </div>
    </div>
</div>

<!-- SCRIPT -->
<script>
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');

    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}
</script>

{% endblock %}
