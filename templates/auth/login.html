{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-green-500 to-emerald-400 flex items-center justify-center font-bold text-black text-2xl shadow-lg shadow-green-500/20 mx-auto mb-4">
                +
            </div>
            <h1 class="text-2xl font-extrabold text-white">Welcome Back</h1>
            <p class="text-gray-400 text-sm mt-1">Sign in with your phone or email</p>
        </div>

        <!-- Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 brand-glow">
            <form method="POST" action="/auth/login">

                <!-- Identity -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Phone or Email</label>
                    <input
                        type="text"
                        name="identity"
                        placeholder="01XXXXXXXXX or you@example.com"
                        required
                        class="w-full bg-gray-950 border border-gray-800 focus:border-green-500 text-white placeholder-gray-600 rounded-xl px-4 py-3 text-sm outline-none transition-all"
                    >
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        class="w-full bg-gray-950 border border-gray-800 focus:border-green-500 text-white placeholder-gray-600 rounded-xl px-4 py-3 text-sm outline-none transition-all"
                    >
                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    class="w-full bg-green-500 hover:bg-green-400 text-gray-950 font-bold py-3 rounded-xl transition-all shadow-md shadow-green-500/10 hover:shadow-green-500/20">
                    Sign In
                </button>

            </form>
        </div>

        <!-- Register Link -->
        <p class="text-center text-sm text-gray-500 mt-6">
            Don't have an account?
            <a href="/auth/register" class="text-green-400 hover:text-green-300 font-medium transition-colors">Create Account</a>
        </p>

    </div>
</div>
{% endblock %}
